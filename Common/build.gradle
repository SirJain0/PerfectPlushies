plugins {
    id 'multiloader-common'
    alias(nyfs.plugins.mdg.loader)
    id 'multiloader-vanilla'
}

dependencies {
    compileOnly(nyfs.bundles.mixin.common.get())
    annotationProcessor nyfs.mixin.extras.common.get()
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly nyfs.geckolib.common.get()
    implementation nyfs.config.api.common.get()
    compileOnly("com.nyfaria:perfectplushieapi-common:${plushie_api_version}+${minecraft_version}") {
        capabilities { requireCapability("com.nyfaria:perfectplushieapi-common-${minecraft_version}") }
    }
}
