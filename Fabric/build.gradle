plugins {
    id 'multiloader-loader'
    alias(nyfs.plugins.loom.loader)
    alias(nyfs.plugins.regutils.loader)
    id("com.nyfaria.moddingtools.dependencies")
    id("com.nyfaria.moddingtools.publishing")
    id 'multiloader-fabric'
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    modDeps.requiredMod(nyfs.geckolib.fabric, "geckolib", null)
    modApi nyfs.config.api.fabric.get()
    include nyfs.config.api.fabric.get()
    modImplementation include("com.nyfaria.perfectplushieapi:perfectplushieapi-Fabric-1.20.1:${plushie_api_version}") {
        transitive = false
    }
}
